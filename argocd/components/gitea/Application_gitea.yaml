apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: openshift-gitops
  labels:
    stp-devops-argocd-type: application
spec:
  destination:
    namespace: gitea
    server: https://kubernetes.default.svc
  project: profile-applications
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
