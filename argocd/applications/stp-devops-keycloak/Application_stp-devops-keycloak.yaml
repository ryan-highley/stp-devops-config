apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stp-devops-keycloak
  namespace: openshift-gitops
spec:
  destination:
    namespace: red-hat-keycloak
    server: https://kubernetes.default.svc
  project: profile-applications
  source:
    repoURL: https://github.com/ryan-highley/stp-devops-config.git
    path: manifests/application/stp-devops-keycloak
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
