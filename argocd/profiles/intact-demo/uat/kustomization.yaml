apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: uat-

resources:
  - ../base

patches:
  - target:
      kind: Application
      labelSelector: "stp-devops-argocd-type=application"
    patch: |-
      - op: replace
        path: /spec/project
        value: uat-profile-applications

  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eap-todo-backend
      spec:
        destination:
          namespace: uat-eap-todo-backend
        source:
          kustomize:
            patches:
              - patch: |-
                  apiVersion: shipwright.io/v1beta1
                  kind: Build
                  metadata:
                    name: eap-todo-backend
                  spec:
                    output:
                      image: image-registry.openshift-image-registry.svc:5000/uat-eap-todo-backend/eap-todo-backend:latest
            images:
              - name: image-registry.openshift-image-registry.svc:5000/eap-todo-backend/eap-todo-backend
                newName: image-registry.openshift-image-registry.svc:5000/uat-eap-todo-backend/eap-todo-backend


  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: jws-tomcat-websocket-chat
      spec:
        destination:
          namespace: uat-jws-tomcat-websocket-chat
        source:
          kustomize:
            patches:
              - patch: |-
                  apiVersion: shipwright.io/v1beta1
                  kind: Build
                  metadata:
                    name: jws-tomcat-websocket-chat
                  spec:
                    output:
                      image: image-registry.openshift-image-registry.svc:5000/uat-jws-tomcat-websocket-chat/jws-tomcat-websocket-chat:latest
            images:
              - name: image-registry.openshift-image-registry.svc:5000/jws-tomcat-websocket-chat/jws-tomcat-websocket-chat
                newName: image-registry.openshift-image-registry.svc:5000/uat-jws-tomcat-websocket-chat/jws-tomcat-websocket-chat
