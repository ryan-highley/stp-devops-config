apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jws-tomcat-websocket-chat
  namespace: openshift-gitops
spec:
  project: dev-profile-applications
  destination:
    namespace: dev-jws-tomcat-websocket-chat
  source:
    kustomize:
      namePrefix: dev-
      patches:
        - patch: |-
            apiVersion: shipwright.io/v1beta1
            kind: Build
            metadata:
              name: jws-tomcat-websocket-chat
            spec:
              output:
                image: image-registry.openshift-image-registry.svc:5000/dev-jws-tomcat-websocket-chat/jws-tomcat-websocket-chat:latest
        - patch: |-
            apiVersion: shipwright.io/v1beta1
            kind: BuildRun
            metadata:
              name: jws-tomcat-websocket-chat
            spec:
              build:
                name: dev-jws-tomcat-websocket-chat
        - patch: |-
            apiVersion: web.servers.org/v1alpha1
            kind: WebServer
            metadata:
                name: jws-tomcat-websocket-chat
            spec:
              applicationName: dev-jws-tomcat-websocket-chat
              webImageStream:
                 imageStreamNamespace: dev-jws-tomcat-websocket-chat
        - patch: |-
            kind: Route
            apiVersion: route.openshift.io/v1
            metadata:
              name: jws-tomcat-websocket-chat
            spec:
              to:
                name: dev-jws-tomcat-websocket-chat
