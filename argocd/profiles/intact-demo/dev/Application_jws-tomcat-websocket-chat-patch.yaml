apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jws-tomcat-websocket-chat
  namespace: openshift-gitops
spec:
  project: dev-profile-applications
  destination:
    namespace: dev-jws-tomcat-websocket-chat
  source:
    kustomize:
      namePrefix: dev-
      images:
        - |
          name: image-registry.openshift-image-registry.svc:5000/jws-tomcat-websocket-chat/jws-tomcat-websocket-chat
          newName: image-registry.openshift-image-registry.svc:5000/dev-jws-tomcat-websocket-chat/jws-tomcat-websocket-chat
      patches:
        - patch: |-
            apiVersion: shipwright.io/v1beta1
            kind: Build
            metadata:
              name: jws-tomcat-websocket-chat
            spec:
              output:
                image: image-registry.openshift-image-registry.svc:5000/dev-jws-tomcat-websocket-chat/jws-tomcat-websocket-chat:latest
        - patch: |-
            apiVersion: shipwright.io/v1beta1
            kind: BuildRun
            metadata:
              name: jws-tomcat-websocket-chat
            spec:
              build:
                name: dev-jws-tomcat-websocket-chat
