apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eap-todo-backend
  namespace: openshift-gitops
spec:
  project: dev-profile-applications
  destination:
    namespace: dev-eap-todo-backend
  source:
    kustomize:
      namePrefix: dev-
      patches:
        - patch: |-
            apiVersion: shipwright.io/v1beta1
            kind: Build
            metadata:
              name: eap-todo-backend
            spec:
              output:
                image: image-registry.openshift-image-registry.svc:5000/dev-eap-todo-backend/eap-todo-backend:latest
      # images:
      #   - name: image-registry.openshift-image-registry.svc:5000/eap-todo-backend/eap-todo-backend
      #     newName: image-registry.openshift-image-registry.svc:5000/dev-eap-todo-backend/eap-todo-backend
