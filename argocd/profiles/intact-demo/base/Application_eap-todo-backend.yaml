apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eap-todo-backend
  namespace: openshift-gitops
  labels:
    stp-devops-argocd-type: application
spec:
  destination:
    namespace: eap-todo-backend
    server: https://kubernetes.default.svc
  project: profile-applications
  source:
    repoURL: https://jbossas.github.io/eap-charts/
    chart: eap81
    targetRevision: 1.0.2
    helm:
      releaseName: eap-todo-backend
      valuesObject:
        build:
          uri: https://github.com/jboss-developer/jboss-eap-quickstarts.git
          ref: EAP_8.1.0.GA
          contextDir: helloworld
          s2i:
            jdk: "21"
        deploy:
          replicas: 1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
