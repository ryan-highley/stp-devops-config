apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: crc-

components:
  - ../../components/cert-manager
  - ../../components/gitea
  - ../../components/openshift-gitops
  - ../../components/red-hat-keycloak

resources:
  - ../base

patches:
  - target:
      kind: Application
      labelSelector: "stp-devops-argocd-type=application"
    patch: |-
      - op: replace
        path: /spec/project
        value: crc-profile-applications
  - target:
      kind: Application
      labelSelector: "stp-devops-argocd-type=operator"
    patch: |-
      - op: replace
        path: /spec/project
        value: crc-profile-operators
