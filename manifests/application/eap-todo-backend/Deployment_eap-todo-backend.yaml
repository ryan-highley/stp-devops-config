apiVersion: apps/v1
kind: Deployment
metadata:
  name: eap-todo-backend
spec:
  selector:
    matchLabels:
      app: eap-todo-backend
  template:
    metadata:
      labels:
        app: eap-todo-backend
    spec:
      containers:
        - name: jws-tomcat
          image: >-
            image-registry.openshift-image-registry.svc:5000/eap-todo-backend/eap-todo-backend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env: []
